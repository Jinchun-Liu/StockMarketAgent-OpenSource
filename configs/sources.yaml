version: "2026-08-31.3"
default_http_policy:
  max_concurrency_per_domain: 1
  minimum_interval_seconds: 5
  conditional_requests: true
  retry_delays_seconds: [60, 300, 1800]
  stop_status_codes: [403, 429]
  user_agent: "StockMarketAgent/0.1 (personal-research; contact=repository-owner)"

