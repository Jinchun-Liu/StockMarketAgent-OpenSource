    name: 上海证券交易所 A 股证券目录
    tier: regulator
    authority: 0.95
    enabled: true
    capabilities: [instrument_directory]
    dev_live:
      capability: instrument.directory
      provider: shanghai_stock_exchange
      access_channel: official_public_web
      runtime_mode: dev_live
      release_tier: dev_only
      rights_status: official_noncommercial_website_terms
      adapter_name: akshare_official_sse_directory
      canonical_url: https://www.sse.com.cn/assortment/stock/list/share/
      allowed_hosts: [www.sse.com.cn]
    data_rights: &official_exchange_directory_rights
      owner: 上海证券交易所
      official_url: https://www.sse.com.cn/home/legal/
      access_method: official_public_web_noncommercial_download
      license_id: official-legal-statement-noncommercial-download-20260831
      expiry: null
      quota: conservative_one_explicit_refresh_per_day
      cache_allowed: allowlisted_metadata_only
      fulltext_allowed: false
      embedding_allowed: false
      training_allowed: false
      redistribution_allowed: false
      retention_days: 3650
      permitted_operations: [fetch, retain]
