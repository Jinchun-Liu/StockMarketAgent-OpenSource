      ScheduleExpression: "cron(10 15 ? * MON-FRI *)"
      ScheduleExpressionTimezone: Asia/Shanghai
      State: DISABLED
      Target:
        Arn:
          Fn::GetAtt:
            - RefreshCluster
            - Arn
        DeadLetterConfig:
          Arn:
