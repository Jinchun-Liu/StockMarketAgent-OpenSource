  TaskFailureRule:
    Type: AWS::Events::Rule
    Condition: HasImageDigest
    Properties:
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          clusterArn:
            - Fn::GetAtt:
                - RefreshCluster
                - Arn
          lastStatus:
            - STOPPED
          taskDefinitionArn:
            - Ref: BootstrapTaskDefinition
            - Ref: RefreshTaskDefinition
          $or:
            - stoppedReason:
                - prefix: Task failed to start
            - containers:
                exitCode:
                  - anything-but: 0
      Name:
        Fn::Sub: "${AWS::StackName}-task-failed"
      State: ENABLED
      Targets:
        - Arn:
            Fn::GetAtt:
              - TaskFailureQueue
              - Arn
          Id: task-failure-queue

Outputs:
  ProductSha:
    Value:
      Ref: ProductSha
  ImageDigest:
    Condition: HasImageDigest
    Value:
      Ref: ImageDigest
  RepositoryUri:
    Value:
      Fn::GetAtt:
        - RefreshRepository
        - RepositoryUri
  DatabaseEndpoint:
    Value:
      Fn::GetAtt:
        - RefreshDatabase
        - Endpoint.Address
  RuntimeDatabaseSecretArn:
    Value:
      Ref: RuntimeDatabaseSecret
  PublicSnapshotBucketName:
    Value:
      Ref: PublicSnapshotBucketName
  PublicBaseUrl:
    Value:
      Ref: PublicBaseUrl
  RefreshClusterArn:
    Condition: HasImageDigest
    Value:
      Fn::GetAtt:
        - RefreshCluster
        - Arn
  BootstrapTaskDefinitionArn:
    Condition: HasImageDigest
    Value:
      Ref: BootstrapTaskDefinition
  RefreshTaskDefinitionArn:
    Condition: HasImageDigest
    Value:
      Ref: RefreshTaskDefinition
  ApiOriginDomainName:
    Condition: HasImageDigest
    Value:
      Fn::GetAtt:
        - ApiLoadBalancer
        - DNSName
  TaskSecurityGroupId:
    Condition: HasImageDigest
    Value:
      Fn::GetAtt:
        - TaskSecurityGroup
        - GroupId
  SchedulerRoleArn:
    Condition: HasImageDigest
    Value:
      Fn::GetAtt:
        - SchedulerRole
        - Arn
  SchedulerDeliveryQueueArn:
    Condition: HasImageDigest
    Value:
      Fn::GetAtt:
        - SchedulerDeliveryQueue
        - Arn
  PublicSubnetIds:
    Condition: HasImageDigest
    Value:
      Fn::Join:
        - ","
        - - Ref: PublicSubnetA
          - Ref: PublicSubnetB
