  BehaviorIntradaySchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasImageDigest
    Properties:
      FlexibleTimeWindow:
        Mode: "OFF"
      Name:
        Fn::Sub: "${AWS::StackName}-behavior-intraday"
      ScheduleExpression: "cron(0/10 9-15 ? * MON-FRI *)"
      ScheduleExpressionTimezone: Asia/Shanghai
      State: DISABLED
      Target:
        Arn:
          Fn::GetAtt:
            - RefreshCluster
            - Arn
        DeadLetterConfig:
