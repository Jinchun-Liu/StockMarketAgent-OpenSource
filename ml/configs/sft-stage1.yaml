version: "2026-07-21.1"
base_model: Qwen/Qwen3.5-9B
task: stage1_instruction_format_evidence
method: qlora
text_only: true
freeze_visual_modules: true
quantization:
  type: nf4
  compute_dtype: bfloat16
lora:
  rank: 32
  alpha: 64
  dropout: 0.05
  target_policy: language_backbone_all_linear
training:
  learning_rate: 0.0001
  max_epochs: 3
  gradient_checkpointing: true
  seeds: [17, 31, 73]
  early_stopping_metric: validation_composite
publishing:
  require_rights_manifest: true
  require_model_card: true
  merge_adapter: false
